name: olc

# kosu.txt değişince çalışır; her satırı sırayla çalıştırır, çıktıları dala commit'ler.
on:
  push:
    branches: [main]
    paths: [kosu.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olc
  cancel-in-progress: false

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Çalıştır
        run: |
          # kosu.txt'deki her satır ayrı bir komuttur; biri başarısız olsa da sonrakiler çalışır.
          set -o pipefail
          mkdir -p ci-out
          : > ci-out/kosu.log
          while IFS= read -r komut || [ -n "$komut" ]; do
            [ -z "$komut" ] && continue
            echo "### $komut" | tee -a ci-out/kosu.log
            bash -c "$komut" < /dev/null 2>&1 | grep -v -E "Warning|warn\(" | tee -a ci-out/kosu.log || echo "HATA: $komut" | tee -a ci-out/kosu.log
          done < kosu.txt
      - name: Sonuçları kaydet
        if: always()
        run: |
          git config user.name "melisayalcinkaya"
          git config user.email "melisa.yalcinkaya22@gmail.com"
          git add -A ci-out tahmin veri || true
          git commit -m "chore: measurement output [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
